<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }
    body {
      background-color: #0b0d14;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: #7C6FFF;
      text-shadow: 0 0 12px rgba(124, 111, 255, 0.6);
    }
    .main-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .preview-box {
      width: 100%;
      background: #121520;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
      border: 1px solid #23283d;
    }
    canvas {
      width: 100%;
      height: 350px;
      display: block;
    }
    .control-panel {
      background: #121520;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #23283d;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 15px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-group.full-width {
      grid-column: 1 / -1;
    }
    .control-group label {
      font-size: 0.9rem;
      color: #a0aec0;
    }
    input[type="text"], select {
      background: #0b0d14;
      border: 1px solid #23283d;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }
    select { max-height: 200px; }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid #23283d; border-radius: 6px; }
    input[type="range"] { accent-color: #7C6FFF; height: 6px; }
    .preset-btns, .theme-btns {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .preset-btns button, .theme-btns button {
      flex: 1;
      background: #23283d;
      border: none;
      color: #fff;
      padding: 6px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .theme-btns button:hover { background: #353d5c; }
    .actions-panel {
      display: flex;
      gap: 10px;
      grid-column: 1 / -1;
      margin-top: 10px;
    }
    button.action-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.action-btn:hover { opacity: 0.9; }
    #shareBtn { background: #23283d; color: #fff; }
    #exportPngBtn { background: #7C6FFF; color: #fff; }
  </style>
</head>
<body>

  <script>
    let appState = {
      text: "يوسف نايف",
      textColor: "#FFFFFF",
      glowColor: "#7C6FFF",
      blur: 15,
      intensity: 4,
      fontSize: 46,
      fontFamily: "Tajawal",
      animation: "none",
      textMotion: "none",
      speed: 2,
      bgColor: "#0B0D14",
      frameStyle: "box"
    };

    const canvas = document.getElementById("neonCanvas");
    const ctx = canvas.getContext("2d");
    let activeAnimation = null;
    let activeTextMotion = null;

    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.parentElement.clientWidth;
      const height = 350;
      
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      
      ctx.scale(dpr, dpr);
    }

    // محرك رسم الـ 30 إطاراً
    function drawBackgroundAndFrame(ctx, width, height, options) {
      const { bgColor, frameStyle, glowColor } = options;
      
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, width, height);

      if (frameStyle === "none") return;

      ctx.save();
      ctx.strokeStyle = glowColor;
      ctx.fillStyle = glowColor;
      ctx.lineWidth = 3;
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 14;

      const p = 30;

      switch (frameStyle) {
        case "box":
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          break;
        case "corners":
          const cl = 35;
          ctx.beginPath();
          ctx.moveTo(p, p + cl); ctx.lineTo(p, p); ctx.lineTo(p + cl, p);
          ctx.moveTo(width - p - cl, p); ctx.lineTo(width - p, p); ctx.lineTo(width - p, p + cl);
          ctx.moveTo(width - p, height - p - cl); ctx.lineTo(width - p, height - p); ctx.lineTo(width - p - cl, height - p);
          ctx.moveTo(p + cl, height - p); ctx.lineTo(p, height - p); ctx.lineTo(p, height - p - cl);
          ctx.stroke();
          break;
        case "doubleBox":
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          ctx.strokeRect(p + 8, p + 8, width - ((p + 8) * 2), height - ((p + 8) * 2));
          break;
        case "roundedBox":
          ctx.beginPath();
          ctx.roundRect(p, p, width - (p * 2), height - (p * 2), 15);
          ctx.stroke();
          break;
        case "circle":
          ctx.beginPath();
          ctx.arc(width / 2, height / 2, Math.min(width, height) / 2 - p, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case "doubleCircle":
          ctx.beginPath();
          ctx.arc(width / 2, height / 2, Math.min(width, height) / 2 - p, 0, Math.PI * 2);
          ctx.arc(width / 2, height / 2, Math.min(width, height) / 2 - p - 8, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case "oval":
          ctx.beginPath();
          ctx.ellipse(width / 2, height / 2, (width / 2) - p, (height / 2) - p - 20, 0, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case "octagon":
          drawPolygon(ctx, width / 2, height / 2, Math.min(width, height) / 2 - p, 8);
          break;
        case "hexagon":
          drawPolygon(ctx, width / 2, height / 2, Math.min(width, height) / 2 - p, 6);
          break;
        case "diamond":
          ctx.beginPath();
          ctx.moveTo(width / 2, p);
          ctx.lineTo(width - p, height / 2);
          ctx.lineTo(width / 2, height - p);
          ctx.lineTo(p, height / 2);
          ctx.closePath();
          ctx.stroke();
          break;
        case "signboardBanner":
          ctx.strokeRect(p, p + 10, width - (p * 2), height - (p * 2) - 20);
          ctx.fillRect(p - 5, height / 2 - 10, 10, 20);
          ctx.fillRect(width - p - 5, height / 2 - 10, 10, 20);
          break;
        case "signboardArch":
          ctx.beginPath();
          ctx.moveTo(p, height - p);
          ctx.lineTo(p, height / 2);
          ctx.arc(width / 2, height / 2, (width / 2) - p, Math.PI, 0, false);
          ctx.lineTo(width - p, height - p);
          ctx.closePath();
          ctx.stroke();
          break;
        case "signboardPillar":
          ctx.strokeRect(p + 15, p, width - ((p + 15) * 2), height - (p * 2));
          ctx.fillRect(p, p, 10, height - (p * 2));
          ctx.fillRect(width - p - 10, p, 10, height - (p * 2));
          break;
        case "signboardBadge":
          ctx.beginPath();
          ctx.moveTo(width / 2, p);
          ctx.lineTo(width - p, p + 20);
          ctx.lineTo(width - p, height - p - 20);
          ctx.lineTo(width / 2, height - p);
          ctx.lineTo(p, height - p - 20);
          ctx.lineTo(p, p + 20);
          ctx.closePath();
          ctx.stroke();
          break;
        case "signboardTag":
          ctx.beginPath();
          ctx.moveTo(p + 20, p);
          ctx.lineTo(width - p, p);
          ctx.lineTo(width - p, height - p);
          ctx.lineTo(p + 20, height - p);
          ctx.lineTo(p, height / 2);
          ctx.closePath();
          ctx.stroke();
          break;
        case "ornateFrame":
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          ctx.strokeRect(p + 6, p + 6, width - ((p + 6) * 2), height - ((p + 6) * 2));
          drawCircleDot(ctx, p, p, 6);
          drawCircleDot(ctx, width - p, p, 6);
          drawCircleDot(ctx, p, height - p, 6);
          drawCircleDot(ctx, width - p, height - p, 6);
          break;
        case "retroRetro":
          ctx.lineWidth = 4;
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          ctx.beginPath();
          ctx.moveTo(p - 10, p - 10); ctx.lineTo(width - p + 10, p - 10);
          ctx.moveTo(p - 10, height - p + 10); ctx.lineTo(width - p + 10, height - p + 10);
          ctx.stroke();
          break;
        case "cyberpunkFrame":
          ctx.setLineDash([15, 5, 5, 5]);
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          ctx.setLineDash([]);
          break;
        case "ledMatrixBorder":
          ctx.setLineDash([2, 8]);
          ctx.lineWidth = 5;
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          ctx.setLineDash([]);
          break;
        case "starburstBorder":
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          drawStar(ctx, p, p, 5, 10, 5);
          drawStar(ctx, width - p, p, 5, 10, 5);
          drawStar(ctx, p, height - p, 5, 10, 5);
          drawStar(ctx, width - p, height - p, 5, 10, 5);
          break;
        case "heartFrame":
          drawHeartShape(ctx, width / 2, height / 2, Math.min(width, height) / 3);
          break;
        case "starFrame":
          drawStar(ctx, width / 2, height / 2, 5, Math.min(width, height) / 2.5, Math.min(width, height) / 5);
          break;
        case "crossFrame":
          ctx.beginPath();
          ctx.moveTo(width / 2, p); ctx.lineTo(width / 2, height - p);
          ctx.moveTo(p, height / 2); ctx.lineTo(width - p, height / 2);
          ctx.stroke();
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          break;
        case "waveFrame":
          ctx.beginPath();
          let waveY;
          for (let x = p; x <= width - p; x += 10) {
            waveY = p + Math.sin(x * 0.05) * 8;
            if (x === p) ctx.moveTo(x, waveY); else ctx.lineTo(x, waveY);
          }
          for (let y = p; y <= height - p; y += 10) {
            let waveX = (width - p) + Math.sin(y * 0.05) * 8;
            ctx.lineTo(waveX, y);
          }
          ctx.stroke();
          break;
        case "zigZagFrame":
          ctx.beginPath();
          let up = false;
          for (let x = p; x <= width - p; x += 15) {
            ctx.lineTo(x, up ? p : p + 10);
            up = !up;
          }
          ctx.stroke();
          break;
        case "theaterMarquee":
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          ctx.setLineDash([4, 12]);
          ctx.lineWidth = 6;
          ctx.strokeRect(p + 6, p + 6, width - ((p + 6) * 2), height - ((p + 6) * 2));
          ctx.setLineDash([]);
          break;
        case "neonTubeBorder":
          ctx.lineWidth = 5;
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          break;
        case "hexagramFrame":
          drawPolygon(ctx, width / 2, height / 2, Math.min(width, height) / 2.2, 6);
          ctx.strokeRect(p + 15, p + 15, width - ((p + 15) * 2), height - ((p + 15) * 2));
          break;
        case "arrowBanner":
          ctx.strokeRect(p + 20, p, width - ((p + 20) * 2), height - (p * 2));
          ctx.beginPath();
          ctx.moveTo(p, height / 2); ctx.lineTo(p + 20, p); ctx.lineTo(p + 20, height - p); ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(width - p, height / 2); ctx.lineTo(width - p - 20, p); ctx.lineTo(width - p - 20, height - p); ctx.closePath();
          ctx.fill();
          break;
        case "royalCrest":
          ctx.strokeRect(p, p, width - (p * 2), height - (p * 2));
          drawStar(ctx, width / 2, p - 2, 5, 12, 6);
          drawStar(ctx, width / 2, height - p + 2, 5, 12, 6);
          break;
      }

      ctx.restore();
    }

    function drawPolygon(ctx, cx, cy, radius, sides) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const angle = (i * 2 * Math.PI) / sides - Math.PI / 2;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function drawCircleDot(ctx, x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = (Math.PI / 2) * 3;
      let x = cx; let y = cy;
      let step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y); rot += step;
        x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y); rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }

    function drawHeartShape(ctx, cx, cy, size) {
      ctx.beginPath();
      let d = size / 2;
      ctx.moveTo(cx, cy + d);
      ctx.bezierCurveTo(cx, cy, cx - d * 2, cy - d * 2, cx - d * 2, cy);
      ctx.bezierCurveTo(cx - d * 2, cy + d, cx, cy + d * 1.8, cx, cy + d * 2.5);
      ctx.bezierCurveTo(cx, cy + d * 1.8, cx + d * 2, cy + d, cx + d * 2, cy);
      ctx.bezierCurveTo(cx + d * 2, cy - d * 2, cx, cy, cx, cy + d);
      ctx.stroke();
    }

    function drawNeonText(ctx, text, x, y, options) {
      const { textColor, glowColor, blur, intensity, fontSize, fontFamily } = options;
      
      ctx.font = `bold ${fontSize}px '${fontFamily}', sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (let i = intensity; i > 0; i--) {
        ctx.save();
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = blur * i;
        ctx.fillStyle = glowColor;
        ctx.globalAlpha = 0.3 / i;
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      ctx.save();
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = blur * 0.5;
      ctx.fillStyle = glowColor;
      ctx.fillText(text, x, y);
      ctx.restore();

      ctx.save();
      ctx.shadowBlur = 0;
      ctx.fillStyle = textColor;
      ctx.fillText(text, x, y);
      ctx.strokeStyle = "#FFFFFF";
      ctx.lineWidth = 1;
      ctx.strokeText(text, x, y);
      ctx.restore();
    }

    function render() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const centerX = width / 2;
      const centerY = height / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackgroundAndFrame(ctx, width, height, appState);
      drawNeonText(ctx, appState.text, centerX, centerY, appState);

      requestAnimationFrame(render);
    }

    // محرك الوميض (30 نمط وميض)
    function applyAnimation(animationType) {
      if (activeAnimation) activeAnimation.cancel();
      if (animationType === "none") return;

      let keyframes = [];
      let options = { duration: 2000, iterations: Infinity, easing: 'ease-in-out' };

      switch (animationType) {
        case "flicker":
          keyframes = [{ opacity: 1 }, { opacity: 0.4 }, { opacity: 0.9 }, { opacity: 0.2 }, { opacity: 1 }];
          options.duration = 1000; options.easing = 'steps(4, end)';
          break;
        case "fastFlicker":
          keyframes = [{ opacity: 1 }, { opacity: 0.1 }, { opacity: 0.8 }, { opacity: 0.05 }, { opacity: 1 }];
          options.duration = 400; options.easing = 'steps(5, end)';
          break;
        case "crtGlitch":
          keyframes = [
            { transform: 'translate(0,0)', filter: 'brightness(1)' },
            { transform: 'translate(-3px, 2px)', filter: 'brightness(1.5) hue-rotate(90deg)' },
            { transform: 'translate(3px, -2px)', filter: 'brightness(0.8)' },
            { transform: 'translate(0,0)', filter: 'brightness(1)' }
          ];
          options.duration = 600;
          break;
        case "stutterPulse":
          keyframes = [{ opacity: 1, filter: 'brightness(1)' }, { opacity: 0.3, filter: 'brightness(0.5)' }, { opacity: 1, filter: 'brightness(1.4)' }];
          options.duration = 800;
          break;
        case "electricSpark":
          keyframes = [{ opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }, { opacity: 0.5 }, { opacity: 0.9 }, { opacity: 0.1 }];
          options.duration = 300;
          break;
        case "neonBuzz":
          keyframes = [{ opacity: 0.8 }, { opacity: 1 }, { opacity: 0.7 }, { opacity: 0.95 }, { opacity: 0.85 }];
          options.duration = 1200; options.easing = 'steps(2, start)';
          break;
        case "subtleFlicker":
          keyframes = [{ opacity: 1 }, { opacity: 0.85 }, { opacity: 0.95 }, { opacity: 0.9 }];
          options.duration = 2500;
          break;
        case "hazardFlash":
          keyframes = [{ opacity: 1, filter: 'brightness(2)' }, { opacity: 0.2, filter: 'brightness(0.5)' }];
          options.duration = 600; options.easing = 'steps(1, end)';
          break;
        case "binaryBlink":
          keyframes = [{ opacity: 1 }, { opacity: 0 }];
          options.duration = 800; options.easing = 'steps(1, end)';
          break;
        case "strobeLight":
          keyframes = [{ opacity: 1, filter: 'brightness(2.5)' }, { opacity: 0.1, filter: 'brightness(0.2)' }];
          options.duration = 150; options.easing = 'steps(1, end)';
          break;
        case "pulse":
          keyframes = [{ transform: 'scale(1)', filter: 'brightness(1)' }, { transform: 'scale(1.03)', filter: 'brightness(1.3)' }, { transform: 'scale(1)', filter: 'brightness(1)' }];
          options.duration = 2000;
          break;
        case "heartbeat":
          keyframes = [
            { transform: 'scale(1)', filter: 'brightness(1)' },
            { transform: 'scale(1.06)', filter: 'brightness(1.4)' },
            { transform: 'scale(0.98)', filter: 'brightness(0.9)' },
            { transform: 'scale(1.04)', filter: 'brightness(1.3)' },
            { transform: 'scale(1)', filter: 'brightness(1)' }
          ];
          options.duration = 1200;
          break;
        case "breathingGlow":
          keyframes = [{ filter: 'brightness(0.7) blur(1px)' }, { filter: 'brightness(1.4) blur(0px)' }, { filter: 'brightness(0.7) blur(1px)' }];
          options.duration = 3500;
          break;
        case "deepWave":
          keyframes = [{ transform: 'scale(0.98)', opacity: 0.7 }, { transform: 'scale(1.04)', opacity: 1 }, { transform: 'scale(0.98)', opacity: 0.7 }];
          options.duration = 3000;
          break;
        case "solarFlare":
          keyframes = [{ filter: 'brightness(1)' }, { filter: 'brightness(2.5)' }, { filter: 'brightness(1)' }];
          options.duration = 1800;
          break;
        case "neonHeartbeat":
          keyframes = [{ transform: 'scale(1)', opacity: 0.8 }, { transform: 'scale(1.08)', opacity: 1 }, { transform: 'scale(1)', opacity: 0.8 }];
          options.duration = 800;
          break;
        case "pulseSmooth":
          keyframes = [{ transform: 'scale(1)' }, { transform: 'scale(1.02)' }, { transform: 'scale(1)' }];
          options.duration = 1500;
          break;
        case "rippleGlow":
          keyframes = [{ filter: 'brightness(0.9) saturate(1)' }, { filter: 'brightness(1.5) saturate(1.8)' }, { filter: 'brightness(0.9) saturate(1)' }];
          options.duration = 2200;
          break;
        case "ambientPulse":
          keyframes = [{ opacity: 0.6 }, { opacity: 0.95 }, { opacity: 0.6 }];
          options.duration = 4000;
          break;
        case "powerSurge":
          keyframes = [{ filter: 'brightness(0.5)' }, { filter: 'brightness(3)' }, { filter: 'brightness(1)' }];
          options.duration = 1000; options.easing = 'steps(3, jump-none)';
          break;
        case "gentleFloat":
          keyframes = [{ transform: 'translateY(0px)' }, { transform: 'translateY(-8px)' }, { transform: 'translateY(0px)' }];
          options.duration = 2500;
          break;
        case "vibrateShake":
          keyframes = [{ transform: 'translate(1px, 1px)' }, { transform: 'translate(-1px, -2px)' }, { transform: 'translate(-2px, 0px)' }, { transform: 'translate(1px, 2px)' }];
          options.duration = 200;
          break;
        case "zoomInZoomOut":
          keyframes = [{ transform: 'scale(0.9)' }, { transform: 'scale(1.05)' }, { transform: 'scale(0.9)' }];
          options.duration = 3000;
          break;
        case "matrixFade":
          keyframes = [{ opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }];
          options.duration = 3000;
          break;
        case "cyberGlitchShift":
          keyframes = [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }];
          options.duration = 500;
          break;
        case "elasticBounce":
          keyframes = [{ transform: 'scale(1)' }, { transform: 'scale(1.07)' }, { transform: 'scale(0.97)' }, { transform: 'scale(1)' }];
          options.duration = 1200;
          break;
        case "radarSweep":
          keyframes = [{ filter: 'brightness(0.8) hue-rotate(0deg)' }, { filter: 'brightness(1.5) hue-rotate(45deg)' }, { filter: 'brightness(0.8) hue-rotate(0deg)' }];
          options.duration = 3500;
          break;
        case "pendulumSwing":
          keyframes = [{ transform: 'rotate(-2deg)' }, { transform: 'rotate(2deg)' }, { transform: 'rotate(-2deg)' }];
          options.duration = 2500;
          break;
        case "neonAurora":
          keyframes = [{ filter: 'hue-rotate(0deg) brightness(1)' }, { filter: 'hue-rotate(60deg) brightness(1.3)' }, { filter: 'hue-rotate(0deg) brightness(1)' }];
          options.duration = 5000;
          break;
        case "hyperDrive":
          keyframes = [{ transform: 'scale(0.95)', filter: 'brightness(0.5)' }, { transform: 'scale(1.1)', filter: 'brightness(2.5)' }, { transform: 'scale(1)', filter: 'brightness(1)' }];
          options.duration = 1500;
          break;
      }

      activeAnimation = canvas.animate(keyframes, options);
    }

    // محرك حركة النص المتقدمة (30 نمط نص متحرك)
    function applyTextMotion(motionType) {
      if (activeTextMotion) activeTextMotion.cancel();
      if (motionType === "none") return;

      let keyframes = [];
      let options = { duration: 2500, iterations: Infinity, easing: 'ease-in-out' };

      switch (motionType) {
        case "fadeIn":
          keyframes = [{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }];
          break;
        case "slideRight":
          keyframes = [{ transform: 'translateX(-100px)', opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(100px)', opacity: 0 }];
          break;
        case "slideLeft":
          keyframes = [{ transform: 'translateX(100px)', opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(-100px)', opacity: 0 }];
          break;
        case "slideUp":
          keyframes = [{ transform: 'translateY(80px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-80px)', opacity: 0 }];
          break;
        case "slideDown":
          keyframes = [{ transform: 'translateY(-80px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(80px)', opacity: 0 }];
          break;
        case "zoomIn":
          keyframes = [{ transform: 'scale(0.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.5)', opacity: 0 }];
          break;
        case "zoomOut":
          keyframes = [{ transform: 'scale(2.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0.2)', opacity: 0 }];
          break;
        case "bounceIn":
          keyframes = [{ transform: 'scale(0.5)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1 }, { transform: 'scale(0.95)' }, { transform: 'scale(1)' }];
          options.duration = 1800;
          break;
        case "flipX":
          keyframes = [{ transform: 'rotateX(90deg)', opacity: 0 }, { transform: 'rotateX(0deg)', opacity: 1 }, { transform: 'rotateX(-90deg)', opacity: 0 }];
          break;
        case "flipY":
          keyframes = [{ transform: 'rotateY(90deg)', opacity: 0 }, { transform: 'rotateY(0deg)', opacity: 1 }, { transform: 'rotateY(-90deg)', opacity: 0 }];
          break;
        case "rotateSpin":
          keyframes = [{ transform: 'rotate(0deg) scale(0.3)', opacity: 0 }, { transform: 'rotate(360deg) scale(1)', opacity: 1 }];
          options.duration = 3000;
          break;
        case "swingPendulum":
          keyframes = [{ transform: 'rotate(-15deg)' }, { transform: 'rotate(15deg)' }, { transform: 'rotate(-15deg)' }];
          break;
        case "waveVertical":
          keyframes = [{ transform: 'translateY(0)' }, { transform: 'translateY(-12px)' }, { transform: 'translateY(12px)' }, { transform: 'translateY(0)' }];
          break;
        case "skewDistort":
          keyframes = [{ transform: 'skewX(0deg)' }, { transform: 'skewX(20deg)' }, { transform: 'skewX(-20deg)' }, { transform: 'skewX(0deg)' }];
          break;
        case "rubberBand":
          keyframes = [{ transform: 'scale(1,1)' }, { transform: 'scale(1.25, 0.75)' }, { transform: 'scale(0.75, 1.25)' }, { transform: 'scale(1,1)' }];
          options.duration = 1200;
          break;
        case "jelloEffect":
          keyframes = [{ transform: 'skew(0deg)' }, { transform: 'skew(-12deg) scale(1.1)' }, { transform: 'skew(10deg) scale(0.9)' }, { transform: 'skew(0deg)' }];
          options.duration = 1000;
          break;
        case "pulseHeart":
          keyframes = [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }];
          options.duration = 900;
          break;
        case "flashAttention":
          keyframes = [{ filter: 'brightness(1)' }, { filter: 'brightness(3) drop-shadow(0 0 20px #fff)' }, { filter: 'brightness(1)' }];
          options.duration = 1200;
          break;
        case "shimmerGlow":
          keyframes = [{ filter: 'drop-shadow(0 0 2px #fff)' }, { filter: 'drop-shadow(0 0 25px #7C6FFF)' }, { filter: 'drop-shadow(0 0 2px #fff)' }];
          options.duration = 2500;
          break;
        case "glitchTextSlide":
          keyframes = [{ transform: 'translateX(0) skewX(0)' }, { transform: 'translateX(-6px) skewX(15deg)' }, { transform: 'translateX(6px) skewX(-15deg)' }, { transform: 'translateX(0) skewX(0)' }];
          options.duration = 500;
          break;
        case "typewriterEffect":
          keyframes = [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }];
          options.duration = 2000; options.easing = 'steps(15, end)';
          break;
        case "matrixRainDrop":
          keyframes = [{ transform: 'translateY(-50px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }];
          options.duration = 1500;
          break;
        case "neonFloatDrift":
          keyframes = [{ transform: 'translateY(0) rotate(0deg)' }, { transform: 'translateY(-6px) rotate(1deg)' }, { transform: 'translateY(6px) rotate(-1deg)' }, { transform: 'translateY(0) rotate(0deg)' }];
          options.duration = 4000;
          break;
        case "elasticSnap":
          keyframes = [{ transform: 'scale(1.4)' }, { transform: 'scale(0.9)' }, { transform: 'scale(1)' }];
          options.duration = 1000;
          break;
        case "waveHorizontal":
          keyframes = [{ transform: 'translateX(-10px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(-10px)' }];
          options.duration = 2000;
          break;
        case "spiralVortex":
          keyframes = [{ transform: 'scale(0.1) rotate(-360deg)', opacity: 0 }, { transform: 'scale(1) rotate(0deg)', opacity: 1 }];
          options.duration = 2000;
          break;
        case "neonPulseWave":
          keyframes = [{ transform: 'scale(1)', filter: 'drop-shadow(0 0 5px #ff0055)' }, { transform: 'scale(1.05)', filter: 'drop-shadow(0 0 30px #ff0055)' }, { transform: 'scale(1)', filter: 'drop-shadow(0 0 5px #ff0055)' }];
          options.duration = 1500;
          break;
        case "popInElastic":
          keyframes = [{ transform: 'scale(0)' }, { transform: 'scale(1.15)' }, { transform: 'scale(0.95)' }, { transform: 'scale(1)' }];
          options.duration = 800;
          break;
        case "blurReveal":
          keyframes = [{ filter: 'blur(15px)', opacity: 0 }, { filter: 'blur(0px)', opacity: 1 }];
          options.duration = 2000;
          break;
        case "infiniteWaveDance":
          keyframes = [
            { transform: 'translateY(0) scale(1)' },
            { transform: 'translateY(-8px) scale(1.03)' },
            { transform: 'translateY(8px) scale(0.97)' },
            { transform: 'translateY(0) scale(1)' }
          ];
          options.duration = 2200;
          break;
      }

      activeTextMotion = canvas.animate(keyframes, options);
    }

    function applyNeonTheme(color, blurVal) {
      appState.glowColor = color;
      appState.blur = blurVal;
      document.getElementById("glowColor").value = color;
      document.getElementById("blurRange").value = blurVal;
      document.getElementById("blurVal").textContent = blurVal;
      saveStateToURL(appState);
    }

    function saveStateToURL(state) {
      try {
        const jsonString = JSON.stringify(state);
        window.location.hash = btoa(encodeURIComponent(jsonString));
      } catch (e) { console.error(e); }
    }

    function loadStateFromURL() {
      try {
        const hash = window.location.hash.substring(1);
        if (!hash) return null;
        return JSON.parse(decodeURIComponent(atob(hash)));
      } catch (e) { return null; }
    }

    function exportCanvasAsPNG() {
      const wasAnimating = appState.animation;
      const wasTextMotion = appState.textMotion;
      if (wasAnimating !== "none" && activeAnimation) activeAnimation.pause();
      if (wasTextMotion !== "none" && activeTextMotion) activeTextMotion.pause();

      const exportScale = 2;
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = canvas.clientWidth * exportScale;
      tempCanvas.height = canvas.clientHeight * exportScale;
      const tempCtx = tempCanvas.getContext("2d");

      drawBackgroundAndFrame(tempCtx, tempCanvas.width, tempCanvas.height, appState);
      drawNeonText(
        tempCtx, 
        appState.text, 
        tempCanvas.width / 2, 
        tempCanvas.height / 2, 
        {
          ...appState,
          fontSize: appState.fontSize * exportScale,
          blur: appState.blur * exportScale
        }
      );

      tempCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `neon-sign-${Date.now()}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        if (wasAnimating !== "none" && activeAnimation) activeAnimation.play();
        if (wasTextMotion !== "none" && activeTextMotion) activeTextMotion.play();
      }, "image/png");
    }

    // ربط الأحداث
    document.getElementById("inputText").addEventListener("input", (e) => {
      appState.text = e.target.value;
      saveStateToURL(appState);
    });

    document.getElementById("fontFamilySelect").addEventListener("change", (e) => {
      appState.fontFamily = e.target.value;
      saveStateToURL(appState);
    });

    document.getElementById("glowColor").addEventListener("input", (e) => {
      appState.glowColor = e.target.value;
      saveStateToURL(appState);
    });

    document.getElementById("bgColor").addEventListener("input", (e) => {
      appState.bgColor = e.target.value;
      saveStateToURL(appState);
    });

    document.getElementById("darkBgPreset").addEventListener("click", () => {
      appState.bgColor = "#0B0D14";
      document.getElementById("bgColor").value = "#0B0D14";
      saveStateToURL(appState);
    });

    document.getElementById("lightBgPreset").addEventListener("click", () => {
      appState.bgColor = "#F4F5F7";
      document.getElementById("bgColor").value = "#F4F5F7";
      saveStateToURL(appState);
    });

    document.getElementById("blurRange").addEventListener("input", (e) => {
      appState.blur = Number(e.target.value);
      document.getElementById("blurVal").textContent = appState.blur;
      saveStateToURL(appState);
    });

    document.getElementById("frameStyleSelect").addEventListener("change", (e) => {
      appState.frameStyle = e.target.value;
      saveStateToURL(appState);
    });

    document.getElementById("animationSelect").addEventListener("change", (e) => {
      appState.animation = e.target.value;
      applyAnimation(appState.animation);
      saveStateToURL(appState);
    });

    document.getElementById("textMotionSelect").addEventListener("change", (e) => {
      appState.textMotion = e.target.value;
      applyTextMotion(appState.textMotion);
      saveStateToURL(appState);
    });

    document.getElementById("shareBtn").addEventListener("click", () => {
      saveStateToURL(appState);
      navigator.clipboard.writeText(window.location.href);
      alert("تم نسخ رابط التصميم بنجاح!");
    });

    document.getElementById("exportPngBtn").addEventListener("click", exportCanvasAsPNG);

    window.addEventListener("DOMContentLoaded", () => {
      const savedState = loadStateFromURL();
      if (savedState) {
        appState = { ...appState, ...savedState };
        document.getElementById("inputText").value = appState.text;
        document.getElementById("fontFamilySelect").value = appState.fontFamily;
        document.getElementById("glowColor").value = appState.glowColor;
        document.getElementById("bgColor").value = appState.bgColor;
        document.getElementById("blurRange").value = appState.blur;
        document.getElementById("blurVal").textContent = appState.blur;
        document.getElementById("frameStyleSelect").value = appState.frameStyle;
        document.getElementById("animationSelect").value = appState.animation;
        document.getElementById("textMotionSelect").value = appState.textMotion;
        applyAnimation(appState.animation);
        applyTextMotion(appState.textMotion);
      }
      setupCanvas();
      render();
    });

    window.addEventListener("resize", setupCanvas);
  </script>
</body>
</html>
