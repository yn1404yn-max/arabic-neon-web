<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>ROYAL-NAVY-SILVER-001</title>
<style>
@font-face{font-family:"Ruqaa";font-weight:700;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2)}
@font-face{font-family:"AmiriR";font-weight:400;src:url(fonts/amiri-arabic-400-normal.woff2)}
@font-face{font-family:"AmiriR";font-weight:700;src:url(fonts/amiri-arabic-700-normal.woff2)}
html,body{margin:0;background:#101C2D}
svg{display:block;width:2160px;height:3840px}
text{direction:rtl;unicode-bidi:plaintext}
</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 3840" width="2160" height="3840">
<defs>
 <radialGradient id="bg" cx="50%" cy="50%" r="75%">
  <stop offset="0" stop-color="#101C2D"/><stop offset=".62" stop-color="#101C2D"/><stop offset="1" stop-color="#091321"/>
 </radialGradient>
 <filter id="velvet" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .75  0 0 0 0 .8  0 0 0 0 .9  0 0 0 .05 0"/>
 </filter>
 <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="583" y2="691">
  <stop offset="0" stop-color="#F0F2F5"/><stop offset=".3" stop-color="#C0C5CD"/><stop offset=".55" stop-color="#D5D9DF"/><stop offset=".8" stop-color="#858B96"/><stop offset="1" stop-color="#C0C5CD"/>
 </linearGradient>
 <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4E7EC"/><stop offset=".45" stop-color="#C0C5CD"/><stop offset="1" stop-color="#7C8390"/></linearGradient>
 <linearGradient id="divG" gradientUnits="userSpaceOnUse" x1="0" y1="2688" x2="0" y2="2995"><stop offset="0" stop-color="#858B96"/><stop offset=".5" stop-color="#F0F2F5"/><stop offset="1" stop-color="#858B96"/></linearGradient>
 <linearGradient id="foilV" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F0F2F5"/><stop offset=".45" stop-color="#D5D9DF"/><stop offset=".55" stop-color="#C0C5CD"/><stop offset="1" stop-color="#858B96"/>
 </linearGradient>
 <linearGradient id="lineG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#858B96"/><stop offset=".5" stop-color="#F0F2F5"/><stop offset="1" stop-color="#858B96"/>
 </linearGradient>
 <filter id="emboss" x="-5%" y="-5%" width="110%" height="110%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
  <feSpecularLighting in="b" surfaceScale="3" specularConstant=".28" specularExponent="30" lighting-color="#F0F2F5" result="sp"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
  <feComposite in="sp" in2="SourceAlpha" operator="in" result="spi"/>
  <feOffset in="SourceAlpha" dx="3" dy="4" result="o"/><feGaussianBlur in="o" stdDeviation="3.5" result="ob"/>
  <feFlood flood-color="#050B14" flood-opacity=".7"/><feComposite in2="ob" operator="in" result="sh"/>
  <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/><feMergeNode in="spi"/></feMerge>
 </filter>
 <filter id="embossT" x="-5%" y="-10%" width="110%" height="120%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="b"/>
  <feSpecularLighting in="b" surfaceScale="2.5" specularConstant=".55" specularExponent="20" lighting-color="#F0F2F5" result="sp"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
  <feComposite in="sp" in2="SourceAlpha" operator="in" result="spi"/>
  <feOffset in="SourceAlpha" dx="2" dy="3" result="o"/><feGaussianBlur in="o" stdDeviation="2.2" result="ob"/>
  <feFlood flood-color="#050B14" flood-opacity=".65"/><feComposite in2="ob" operator="in" result="sh"/>
  <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/><feMergeNode in="spi"/></feMerge>
 </filter>
</defs>
<rect width="2160" height="3840" fill="url(#bg)"/>
<rect width="2160" height="3840" filter="url(#velvet)"/>
<g id="frame"></g>
<g id="texts"></g>
<g id="icons"></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg", W=2160, H=3840;
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};

/* ---------- ornament geometry ---------- */
const LEAF="M0 0C.12-.3.38-.44.6-.36C.53-.28.58-.22.7-.2C.64-.12.7-.08.86-.06C.78-.02.88.02 1 .05C.72.1.3.08 0 0Z";
const bez=(a,b,c,d,n)=>{const r=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;r.push([u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]])}return r};
function curl(P,T,R0,side,sweep,k,n){
  const nx=side*T[1], ny=-side*T[0]; const C=[P[0]+R0*nx,P[1]+R0*ny];
  const th0=Math.atan2(P[1]-C[1],P[0]-C[0]);
  let d=(-Math.sin(th0)*T[0]+Math.cos(th0)*T[1])>0?1:-1;
  const r=[];for(let i=1;i<=n;i++){const s=sweep*i/n,th=th0+d*s,rr=R0*Math.exp(-k*s);r.push([C[0]+rr*Math.cos(th),C[1]+rr*Math.sin(th)])}return r}
function arm(pts,w0,w1){return {pts,w0,w1}}
function ribbon(pts,w0,w1){
  const n=pts.length,L=[],R=[];
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const t=i/(n-1),w=(w0*Math.pow(1-t,.8)+w1*t)/2;L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w])}
  return "M"+L.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L")+"L"+R.reverse().map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L")+"Z"}
function norm(a,b){const l=Math.hypot(b[0]-a[0],b[1]-a[1]);return[(b[0]-a[0])/l,(b[1]-a[1])/l]}
function leaf(g,x,y,ang,s,flip){
  const t=el("g",{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${s.toFixed(1)} ${(flip*s).toFixed(1)})`},g);
  el("path",{d:LEAF,fill:"url(#leafG)",stroke:"#858B96","stroke-width":(1.6/s).toFixed(4),"stroke-linejoin":"round"},t);
  el("path",{d:"M.04 0C.3.0.55-.1.8-.04",fill:"none",stroke:"#F0F2F5","stroke-width":(1.4/s).toFixed(4),opacity:".8"},t);
  el("path",{d:"M.2-.02C.28-.12.38-.2.46-.26M.4.0C.48-.09.58-.14.66-.17",fill:"none",stroke:"#858B96","stroke-width":(1.1/s).toFixed(4)},t)}
function scrollArm(g,def){
  const pts=bez(def.b[0],def.b[1],def.b[2],def.b[3],60);
  const T=norm(pts[pts.length-3],pts[pts.length-1]);
  const c=curl(pts[pts.length-1],T,def.R,def.side,def.sweep,def.k,70);
  const all=pts.concat(c);
  el("path",{d:ribbon(all,def.w0,def.w1),fill:"url(#silver)",stroke:"#858B96","stroke-width":2,"stroke-linejoin":"round"},g);
  el("path",{d:"M"+all.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L"),fill:"none",stroke:"#F0F2F5","stroke-width":2.2,opacity:".75"},g);
  // acanthus leaves along the arm
  const N=all.length;
  def.leaves.forEach(([i,side,s,rot])=>{const j=Math.min(N-2,Math.max(1,i));const a=all[j-1],b=all[j+1];
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;leaf(g,all[j][0],all[j][1],ang+side*(rot*.62),s*1.12,side)});
  return all}
function rosette(g,x,y,r){
  const t=el("g",{transform:`translate(${x} ${y})`},g);
  for(let ring=0;ring<2;ring++){const n=ring?12:8,s=r*(ring?.62:1),off=ring?Math.PI/n:0;
    for(let i=0;i<n;i++){const a=(i/n)*360+(ring?180/n:0);
      const p=el("g",{transform:`rotate(${a})`},t);
      el("path",{d:"M0 0C.2-.28.85-.3 1 0C.85.3.2.28 0 0Z",transform:`scale(${s})`,fill:"url(#leafG)",stroke:"#858B96","stroke-width":1.8/ s*1,"stroke-linejoin":"round"},p);
      el("path",{d:"M.1 0L.85 0",transform:`scale(${s})`,stroke:"#858B96","stroke-width":1.2/s,fill:"none"},p)}}
  el("circle",{r:r*.2,fill:"url(#silver)",stroke:"#858B96","stroke-width":2},t);
  el("circle",{r:r*.09,fill:"#F0F2F5"},t)}
function corner(g){
  // frame-hugging acanthus arms
  const arms=[
   {b:[[205,168],[300,88],[392,222],[498,138]],R:50,side:1,sweep:7.2,k:.17,w0:34,w1:5,
    leaves:[[8,-1,95,64],[16,1,85,60],[24,-1,100,62],[32,1,90,58],[40,-1,86,60],[48,1,70,56],[56,-1,60,58],[78,1,52,66],[100,-1,40,70],[118,1,34,70]]},
   {b:[[168,208],[88,300],[222,420],[140,560]],R:50,side:-1,sweep:7.2,k:.17,w0:34,w1:5,
    leaves:[[8,1,95,64],[16,-1,85,60],[24,1,100,62],[32,-1,90,58],[40,1,86,60],[48,-1,70,56],[56,1,60,58],[78,-1,52,66],[100,1,40,70],[118,-1,34,70]]},
   {b:[[225,238],[300,270],[290,380],[390,420]],R:44,side:1,sweep:6.6,k:.18,w0:30,w1:4,
    leaves:[[10,1,90,60],[20,-1,84,58],[30,1,80,58],[40,-1,70,56],[52,1,60,58],[84,-1,44,66],[104,1,34,70]]}
  ];
  arms.forEach(a=>scrollArm(g,a));
  rosette(g,170,190,92);
}
function midOrn(g,x,y,rot){
  const t=el("g",{transform:`translate(${x} ${y}) rotate(${rot})`},g);
  el("path",{d:"M-86 0C-52-14-34-26 0-32C34-26 52-14 86 0C52 14 34 26 0 32C-34 26-52 14-86 0Z",fill:"#101C2D",stroke:"#C0C5CD","stroke-width":3},t);
  el("path",{d:"M-70 0C-44-10-28-20 0-25C28-20 44-10 70 0C44 10 28 20 0 25C-28 20-44 10-70 0Z",fill:"none",stroke:"#858B96","stroke-width":2},t);
  [-1,1].forEach(sx=>[-1,1].forEach(sy=>{const q=el("g",{transform:`translate(${sx*30} 0) scale(${sx} ${sy})`},t);
    el("path",{d:"M0 0C.2-.3.7-.45 1 -.3C.8-.15.9-.05 1 0",transform:"scale(36 38)",fill:"url(#silver)",stroke:"#858B96","stroke-width":.05},q)}));
  [-1,1].forEach(sx=>{const q=el("g",{transform:`translate(${sx*62} 0) scale(${sx} 1)`},t);el("path",{d:"M0 0L22 0",stroke:"#C0C5CD","stroke-width":3},q);el("circle",{cx:24,r:4,fill:"#F0F2F5"},q)});
  rosette(t,0,0,17)}

/* ---------- frame ---------- */
(function(){
  const g=document.getElementById("frame");
  const o=W*.018,i=W*.035;
  el("rect",{x:o,y:o,width:W-2*o,height:H-2*o,fill:"none",stroke:"url(#lineG)","stroke-width":5},g);
  el("rect",{x:i,y:i,width:W-2*i,height:H-2*i,fill:"none",stroke:"url(#lineG)","stroke-width":2.6},g);
  const mid=(o+i)/2;
  midOrn(g,W/2,mid,0);midOrn(g,W/2,H-mid,0);midOrn(g,mid,H/2,90);midOrn(g,W-mid,H/2,90);
  [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(([x,y,sx,sy])=>{
    const c=el("g",{transform:`translate(${x} ${y}) scale(${sx} ${sy})`,filter:"url(#emboss)"},g);corner(c)});
})();

/* ---------- text ---------- */
const cv=document.createElement("canvas").getContext("2d");
const SPEC=[
 // key, text, x%, y%, font, size, maxW
 ["title","دعوة",50,12,"700 {s}px Ruqaa",420,900],
 ["blessing","بارك الله لهما وبارك عليهما وجمع بينهما في خير",50,22,"400 {s}px AmiriR",104,1560],
 ["intro","يتشرف",50,29.5,"700 {s}px Ruqaa",120,900],
 ["host","أبناء عبدالله ماجد الزامل",50,34,"700 {s}px AmiriR",166,1480],
 ["invite","بدعوتكم لحضور حفل زواج أخيهم",50,40.5,"400 {s}px AmiriR",120,1480],
 ["groom","بندر",50,50,"700 {s}px Ruqaa",470,1100],
 ["dinner","وتناول طعام العشاء وذلك بمشيئة الله",50,59.5,"400 {s}px AmiriR",112,1480],
 ["day","يوم الأربعاء ليلة الخميس",50,64.5,"700 {s}px AmiriR",122,1480],
 ["v1","قاعة رويال",32,74,"700 {s}px AmiriR",84,640],
 ["v2","للمناسبات",32,77,"400 {s}px AmiriR",84,640],
 ["hij","22 / 06 / 1448 هـ",68,74,"700 {s}px AmiriR",84,640],
 ["greg","02 / 12 / 2026 م",68,77,"700 {s}px AmiriR",84,640],
 ["closing","وبحضوركم يكتمل لنا الفرح والسرور",50,85,"700 {s}px Ruqaa",138,1500],
];
async function build(){
  await Promise.all(["700 40px Ruqaa","400 40px AmiriR","700 40px AmiriR"].map(f=>document.fonts.load(f,"دعوة بندر 0123")));
  const g=document.getElementById("texts");
  for(const [key,txt,xp,yp,f,s0,maxW] of SPEC){
    let s=s0,m;
    for(;;){cv.font=f.replace("{s}",s);cv.direction="rtl";m=cv.measureText(txt);if(m.width<=maxW||s<20)break;s-=2}
    const cx=W*xp/100,cy=H*yp/100;
    const base=cy+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
    const [wt,,fam]=[f.split(" ")[0],0,f.split(" ").slice(2).join(" ")];
    const t=el("text",{x:cx,y:base,"text-anchor":"middle","font-family":fam.replace(/"/g,""),"font-weight":wt,"font-size":s,fill:"url(#foilV)",filter:"url(#embossT)",direction:"rtl"},g);
    t.textContent=txt;
    t.setAttribute("data-key",key);t.setAttribute("data-size",s);
  }
  // vertical divider
  el("line",{x1:W/2,x2:W/2,y1:H*.70,y2:H*.78,stroke:"url(#divG)","stroke-width":4,"stroke-linecap":"round"},document.getElementById("icons"));
  icons();
  window.__ready=true;
}
function icons(){
  const g=document.getElementById("icons");
  const mk=(x,y)=>el("g",{transform:`translate(${x} ${y})`,filter:"url(#embossT)"},g);
  // location pin (center 32%, 70.5%)
  let p=mk(W*.32,H*.705);
  el("path",{d:"M0 52C-6 40-40 8-40-18A40 40 0 0 1 40-18C40 8 6 40 0 52Z",fill:"url(#foilV)",stroke:"#858B96","stroke-width":2.5,transform:"translate(0 -2)"},p);
  el("circle",{cx:0,cy:-20,r:15,fill:"#101C2D"},p);
  // calendar (68%, 70.5%)
  p=mk(W*.68,H*.705);
  el("rect",{x:-42,y:-38,width:84,height:80,rx:9,fill:"none",stroke:"url(#foilV)","stroke-width":8},p);
  el("rect",{x:-42,y:-38,width:84,height:24,rx:6,fill:"url(#foilV)"},p);
  [-20,20].forEach(x=>el("rect",{x:x-4,y:-50,width:8,height:20,rx:4,fill:"url(#foilV)"},p));
  for(let r=0;r<2;r++)for(let c=0;c<3;c++)el("rect",{x:-26+c*22,y:-4+r*20,width:12,height:11,rx:2,fill:"url(#foilV)"},p);
}
build();
</script></body></html>
